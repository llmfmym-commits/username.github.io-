name: Build Nova Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract latest ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f \
            -name 'NovaBrowser-*.zip' | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "NovaBrowser ZIP not found!"
            exit 1
          fi

          echo "Selected: $ZIP"
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          cd "$PROJECT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
